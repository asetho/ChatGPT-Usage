<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <title>ChatGPT Usage icon — Orbit</title>
  <desc>A mint progress arc orbiting a bright central point on a dark app tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#303640"/>
      <stop offset="1" stop-color="#13171d"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a1f4d8"/>
      <stop offset="1" stop-color="#47dcae"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#tile)" stroke="#5b6570" stroke-width="3"/>
  <circle cx="256" cy="256" r="157" fill="none" stroke="#424b56" stroke-width="59"/>
  <circle cx="256" cy="256" r="157" fill="none" stroke="url(#progress)" stroke-width="59"
          stroke-linecap="round" stroke-dasharray="552 435" transform="rotate(-126 256 256)"/>
  <circle cx="256" cy="256" r="67" fill="#f8f4e9"/>
  <circle cx="256" cy="256" r="25" fill="#202830"/>
</svg>
