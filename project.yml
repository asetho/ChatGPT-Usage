name: CodexUsage

options:
  minimumXcodeGenVersion: 2.45.0
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    # Release scripts replace these placeholders with the repository VERSION value.
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "0"

targets:
  CodexUsage:
    type: application
    platform: macOS
    sources:
      - path: CodexUsage
        excludes:
          - Resources
      - path: CodexUsage/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaronwhippo.CodexUsage
        PRODUCT_NAME: "ChatGPT Usage"
        PRODUCT_MODULE_NAME: CodexUsage
        INFOPLIST_FILE: CodexUsage/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies: []

  CodexUsageTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: CodexUsageTests
    dependencies:
      - target: CodexUsage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aaronwhippo.CodexUsageTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/ChatGPT Usage.app/Contents/MacOS/ChatGPT Usage"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  CodexUsage:
    build:
      targets:
        CodexUsage: all
    test:
      gatherCoverageData: true
      targets:
        - CodexUsageTests
      environmentVariables:
        CODEX_EXECUTABLE: /usr/bin/false
